<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>737 Crash Simulation</title>
  <style>
    /* Fill the whole browser window with the 3D canvas, no scrollbars. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    #scene { position: fixed; inset: 0; }

    /* Floating glass panel, top-left: the flight instruments (HUD). */
    #hud {
      position: fixed; top: 18px; left: 18px; z-index: 10;
      background: rgba(12, 20, 30, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 18px; color: #eaf2fb;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      min-width: 170px;
    }
    #hud .title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; }
    #hud .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; margin: 3px 0; }
    #hud .label { opacity: 0.65; font-size: 13px; }
    #hud .value { font-weight: 600; font-size: 15px; }
    #status { margin-top: 10px; font-size: 13px; color: #ffd27a; min-height: 18px; }

    /* Bottom-center control buttons. */
    #controls {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 12px;
    }
    button {
      font-size: 15px; font-weight: 600; letter-spacing: 0.4px;
      padding: 12px 26px; border-radius: 999px; border: none; cursor: pointer;
      color: #fff; transition: transform 0.08s ease, filter 0.15s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    button:hover { filter: brightness(1.12); }
    button:active { transform: translateY(1px); }
    #startBtn { background: linear-gradient(135deg, #1f8a4c, #34c26f); }
    #resetBtn { background: linear-gradient(135deg, #b23a3a, #e05656); }
  </style>
</head>
<body>
  <!-- The 3D scene renders into this div. -->
  <div id="scene"></div>

  <!-- Flight instruments overlay. -->
  <div id="hud">
    <div class="title">Boeing 737 · Flight Data</div>
    <div class="row"><span class="label">Altitude</span><span class="value" id="alt">0 ft</span></div>
    <div class="row"><span class="label">Airspeed</span><span class="value" id="spd">0 kts</span></div>
    <div id="status">Loading…</div>
  </div>

  <!-- Start / Reset controls. -->
  <div id="controls">
    <button id="startBtn">▶ Start</button>
    <button id="resetBtn">↺ Reset</button>
  </div>

  <!-- Three.js (global build), then our files. Order matters: THREE must load
       first, then plane.js/effects.js define globals main.js depends on. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="plane.js"></script>
  <script src="effects.js"></script>
  <script src="main.js"></script>
</body>
</html>
