<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PD·8 — Pocket Drums</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e9e6df'/><rect x='18' y='38' width='26' height='24' rx='6' fill='%23ff4a1f'/><rect x='56' y='38' width='26' height='24' rx='6' fill='%234a6fa5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --backdrop-hi:#cfcbc3;
    --backdrop-lo:#aaa69d;
    --body-plastic:#e9e6df;
    --body-edge:#f7f5f0;
    --body-shade:#d2cec5;
    --engrave:#6e6a61;
    --engrave-dark:#4c4941;
    --lcd-bg:#96a288;
    --lcd-bg-lo:#87947a;
    --lcd-ink:#26301f;
    --step-off:#dedad2;
    --kick:#ff4a1f;
    --snare:#4a6fa5;
    --hat:#e0a526;
    --clap:#c75d8a;
    --shadow-ink:rgba(43,40,34,.55);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"Archivo",sans-serif;
    background:radial-gradient(120% 90% at 50% 12%, var(--backdrop-hi) 0%, var(--backdrop-lo) 78%);
    color:var(--engrave-dark);
    display:grid;
    place-items:center;
    padding:28px 16px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    width:100%;
    max-width:680px;
  }

  /* ---------- device body ---------- */

  .device{
    width:100%;
    background:linear-gradient(178deg, var(--body-edge) 0%, var(--body-plastic) 9%, var(--body-plastic) 88%, var(--body-shade) 100%);
    border-radius:26px;
    padding:26px 28px 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.85) inset,
      0 -2px 0 rgba(43,40,34,.10) inset,
      0 24px 48px -18px var(--shadow-ink),
      0 6px 14px -6px rgba(43,40,34,.35);
    position:relative;
  }

  .screw{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f2f0ea, #b9b5ac 70%);
    box-shadow:0 1px 1px rgba(255,255,255,.8), 0 0 2px rgba(43,40,34,.5) inset;
  }
  .screw::after{
    content:"";
    position:absolute; inset:3px 1px auto 1px;
    height:1.5px; background:rgba(43,40,34,.45);
    transform:rotate(38deg); border-radius:1px;
  }
  .screw.tl{ top:11px; left:12px; }
  .screw.tr{ top:11px; right:12px; }
  .screw.bl{ bottom:11px; left:12px; }
  .screw.br{ bottom:11px; right:12px; transform:rotate(70deg); }

  /* ---------- top face: brand · lcd · transport ---------- */

  .face-top{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:20px;
    align-items:stretch;
    margin-bottom:22px;
  }

  .brand{
    align-self:center;
    line-height:.95;
  }
  .brand strong{
    display:block;
    font-size:34px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--engrave-dark);
  }
  .brand span{
    display:block;
    margin-top:6px;
    font-size:10px;
    font-weight:600;
    letter-spacing:.32em;
    color:var(--engrave);
  }

  .lcd{
    background:linear-gradient(180deg, var(--lcd-bg-lo), var(--lcd-bg) 30%);
    border-radius:10px;
    padding:10px 16px 9px;
    box-shadow:
      0 2px 6px rgba(43,40,34,.5) inset,
      0 1px 0 rgba(255,255,255,.7);
    font-family:"IBM Plex Mono",monospace;
    color:var(--lcd-ink);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:4px;
    min-width:0;
  }
  .lcd-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    opacity:.85;
  }
  .lcd-bpm{
    font-size:26px;
    font-weight:600;
    letter-spacing:.04em;
    line-height:1;
  }
  .lcd-bpm small{ font-size:11px; letter-spacing:.14em; margin-left:6px; }
  .lcd-steps{
    display:flex;
    gap:5px;
  }
  .lcd-steps i{
    flex:1;
    height:5px;
    border-radius:1.5px;
    background:currentColor;
    opacity:.22;
  }
  .lcd-steps i.lit{ opacity:1; }

  .transport{
    display:grid;
    grid-template-columns:auto auto;
    grid-template-rows:auto auto;
    gap:8px 10px;
    align-content:center;
  }

  .btn{
    font-family:"Archivo",sans-serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    color:var(--engrave-dark);
    background:linear-gradient(180deg, #f4f2ec, #ddd9d1);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 2px 4px rgba(43,40,34,.35),
      0 1px 0 rgba(43,40,34,.2);
    border-radius:9px;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .btn:active{
    transform:translateY(1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 1px 2px rgba(43,40,34,.3);
  }

  .btn-play{
    grid-row:1 / 3;
    width:64px;
    align-self:stretch;
    border-radius:14px;
    background:linear-gradient(180deg, #ff6a42, var(--kick) 55%, #e33c12);
    color:#fff;
    font-size:18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.45) inset,
      0 3px 6px rgba(180,42,8,.5),
      0 1px 0 rgba(43,40,34,.25);
  }
  .btn-play[aria-pressed="true"]{
    background:linear-gradient(180deg, #e33c12, #c72f09);
    box-shadow:0 2px 5px rgba(43,40,34,.4) inset;
  }

  .btn-small{
    padding:7px 12px;
    font-size:12px;
    letter-spacing:.06em;
    min-width:44px;
  }

  /* ---------- step grid ---------- */

  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:linear-gradient(180deg, #dcd8d0, #e4e1da);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 5px rgba(43,40,34,.22) inset, 0 1px 0 rgba(255,255,255,.8);
  }

  .track{
    display:grid;
    grid-template-columns:82px repeat(8, 1fr);
    gap:8px;
    align-items:center;
  }

  .track-head{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
  }

  .track-label{
    font-size:10px;
    font-weight:700;
    letter-spacing:.18em;
    color:var(--engrave);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .track-label::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:var(--tc);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.7), 0 1px 2px rgba(43,40,34,.3);
    flex:none;
  }

  .track-controls{
    display:flex;
    gap:4px;
  }
  .track-toggle{
    width:25px;
    height:17px;
    border:0;
    border-radius:4px;
    cursor:pointer;
    font-family:"IBM Plex Mono",monospace;
    font-size:8px;
    font-weight:600;
    color:var(--engrave);
    background:linear-gradient(180deg, #f1eee8, #d4d0c8);
    box-shadow:0 1px 2px rgba(43,40,34,.28), 0 1px 0 rgba(255,255,255,.8) inset;
  }
  .track-toggle[aria-pressed="true"]{
    color:#fff;
    background:var(--tc);
    box-shadow:0 1px 3px color-mix(in srgb, var(--tc) 55%, transparent) inset;
  }
  .track.is-silent .step{ opacity:.48; }
  .track.is-solo .track-label{ color:var(--engrave-dark); }

  .step{
    aspect-ratio:1 / .82;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(180deg, #d7d3ca, var(--step-off));
    box-shadow:
      0 2px 3px rgba(43,40,34,.3) inset,
      0 1px 0 rgba(255,255,255,.75);
    transition:background .1s ease, box-shadow .1s ease, filter .05s ease;
  }
  .step[aria-pressed="true"]{
    background:linear-gradient(180deg, color-mix(in srgb, var(--tc) 86%, white), var(--tc));
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 2px 5px color-mix(in srgb, var(--tc) 55%, transparent),
      0 1px 0 rgba(43,40,34,.2);
  }
  .step.now{ filter:brightness(1.18); }
  .step[aria-pressed="true"].now{
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 0 14px 1px color-mix(in srgb, var(--tc) 70%, transparent),
      0 1px 0 rgba(43,40,34,.2);
  }

  /* beat groups: subtle extra gap after step 4 */
  .track .step:nth-of-type(5){ margin-left:8px; }

  .track[data-track="kick"]{  --tc:var(--kick); }
  .track[data-track="snare"]{ --tc:var(--snare); }
  .track[data-track="hat"]{   --tc:var(--hat); }
  .track[data-track="clap"]{  --tc:var(--clap); }

  /* ---------- bottom face ---------- */

  .face-bottom{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10px;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--engrave);
  }
  .face-bottom .vents{ display:flex; gap:4px; }
  .face-bottom .vents i{
    width:3px; height:14px;
    border-radius:2px;
    background:rgba(43,40,34,.18);
    box-shadow:0 1px 0 rgba(255,255,255,.6);
  }

  .caption{
    font-size:12px;
    font-weight:500;
    letter-spacing:.04em;
    color:#7d7970;
    text-align:center;
  }
  .caption kbd{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    background:rgba(255,255,255,.5);
    border:1px solid rgba(43,40,34,.2);
    border-bottom-width:2px;
    border-radius:4px;
    padding:1px 6px;
  }

  /* ---------- focus & motion ---------- */

  button:focus-visible{
    outline:2.5px solid var(--engrave-dark);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: no-preference){
    .btn-play[aria-pressed="true"]{ animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse{
      50%{ box-shadow:0 2px 5px rgba(43,40,34,.4) inset, 0 0 18px rgba(255,74,31,.55); }
    }
  }

  /* ---------- responsive ---------- */

  @media (max-width:640px){
    .device{ padding:20px 16px 16px; border-radius:20px; }
    .face-top{ grid-template-columns:1fr; gap:14px; }
    .brand{ display:flex; align-items:baseline; gap:12px; }
    .brand strong{ font-size:26px; }
    .transport{ grid-template-columns:auto auto auto auto; grid-template-rows:auto; justify-content:start; }
    .btn-play{ grid-row:auto; width:56px; height:44px; }
    .track{ grid-template-columns:62px repeat(8, 1fr); gap:5px; }
    .track .step:nth-of-type(5){ margin-left:5px; }
    .track-label{ font-size:9px; letter-spacing:.12em; }
    .track-toggle{ width:23px; height:16px; }
    .face-bottom span{ letter-spacing:.12em; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="device" role="application" aria-label="PD-8 pocket drum machine">
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>

    <div class="face-top">
      <div class="brand">
        <strong>PD·8</strong>
        <span>POCKET DRUMS</span>
      </div>

      <div class="lcd" aria-live="off">
        <div class="lcd-row"><span>PTN A1</span><span id="lcdState">READY</span></div>
        <div class="lcd-bpm"><span id="lcdBpm">112</span><small>BPM</small></div>
        <div class="lcd-steps" id="lcdSteps"></div>
      </div>

      <div class="transport">
        <button class="btn btn-play" id="playBtn" aria-pressed="false" aria-label="Play or stop">▶</button>
        <button class="btn btn-small" id="bpmDown" aria-label="Slow tempo down">−5</button>
        <button class="btn btn-small" id="bpmUp" aria-label="Speed tempo up">+5</button>
        <button class="btn btn-small" id="clearBtn" style="grid-column:2 / 4">CLEAR</button>
      </div>
    </div>

    <section class="grid" id="grid" aria-label="Step sequencer, 4 tracks of 8 steps"></section>

    <div class="face-bottom">
      <span>STEP SEQUENCER</span>
      <div class="vents" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span>MONO OUT</span>
    </div>
  </div>

  <p class="caption">Click steps to program a beat · <kbd>Space</kbd> plays and stops</p>
</main>

<script>
(() => {
  const STEPS = 8;
  const TRACKS = [
    { id:"kick",  name:"KICK",  seed:[1,0,0,0,1,0,0,0] },
    { id:"snare", name:"SNARE", seed:[0,0,1,0,0,0,1,0] },
    { id:"hat",   name:"HAT",   seed:[1,1,1,1,1,1,1,1] },
    { id:"clap",  name:"CLAP",  seed:[0,0,0,0,0,0,1,0] },
  ];

  let pattern = TRACKS.map(t => [...t.seed]);
  let bpm = 112;
  let playing = false;
  let step = 0;            // next step to schedule
  let nextTime = 0;        // audio-clock time of that step
  let timer = null;
  let ctx = null;
  const trackState = TRACKS.map(() => ({ muted:false, solo:false }));

  // localStorage save/load
  function loadState() {
    const saved = localStorage.getItem("pd8-state");
    if (saved) {
      const state = JSON.parse(saved);
      pattern = state.pattern || pattern;
      bpm = state.bpm || 112;
    }
  }
  function saveState() {
    localStorage.setItem("pd8-state", JSON.stringify({ pattern, bpm }));
  }
  loadState();

  /* ---------- build the grid ---------- */

  const grid = document.getElementById("grid");
  const stepEls = [];
  const trackEls = [];
  const trackToggleEls = [];

  function trackIsAudible(ti) {
    const anySolo = trackState.some(state => state.solo);
    return !trackState[ti].muted && (!anySolo || trackState[ti].solo);
  }

  function refreshTrackControls() {
    trackState.forEach((state, ti) => {
      const audible = trackIsAudible(ti);
      trackEls[ti].classList.toggle("is-silent", !audible);
      trackEls[ti].classList.toggle("is-solo", state.solo);
      trackToggleEls[ti].mute.setAttribute("aria-pressed", String(state.muted));
      trackToggleEls[ti].solo.setAttribute("aria-pressed", String(state.solo));
    });
  }

  TRACKS.forEach((t, ti) => {
    const row = document.createElement("div");
    row.className = "track";
    row.dataset.track = t.id;
    trackEls[ti] = row;
    const head = document.createElement("div");
    head.className = "track-head";
    const label = document.createElement("span");
    label.className = "track-label";
    label.textContent = t.name;
    head.appendChild(label);
    const controls = document.createElement("div");
    controls.className = "track-controls";
    const mute = document.createElement("button");
    mute.className = "track-toggle";
    mute.textContent = "M";
    mute.setAttribute("aria-label", `Mute ${t.name}`);
    mute.setAttribute("aria-pressed", "false");
    const solo = document.createElement("button");
    solo.className = "track-toggle";
    solo.textContent = "S";
    solo.setAttribute("aria-label", `Solo ${t.name}`);
    solo.setAttribute("aria-pressed", "false");
    mute.addEventListener("click", () => {
      trackState[ti].muted = !trackState[ti].muted;
      refreshTrackControls();
    });
    solo.addEventListener("click", () => {
      trackState[ti].solo = !trackState[ti].solo;
      refreshTrackControls();
    });
    controls.append(mute, solo);
    head.appendChild(controls);
    row.appendChild(head);
    trackToggleEls[ti] = { mute, solo };
    stepEls[ti] = [];
    for (let s = 0; s < STEPS; s++) {
      const b = document.createElement("button");
      b.className = "step";
      b.setAttribute("aria-pressed", pattern[ti][s] ? "true" : "false");
      b.setAttribute("aria-label", `${t.name} step ${s + 1}`);
      b.addEventListener("click", () => {
        pattern[ti][s] ^= 1;
        b.setAttribute("aria-pressed", pattern[ti][s] ? "true" : "false");
        saveState();
      });
      row.appendChild(b);
      stepEls[ti].push(b);
    }
    grid.appendChild(row);
  });

  // sync UI after loading state
  function updateUI() {
    stepEls.forEach((row, ti) => {
      row.forEach((btn, s) => {
        btn.setAttribute("aria-pressed", pattern[ti][s] ? "true" : "false");
      });
    });
    lcdBpm.textContent = bpm;
  }

  const lcdSteps = document.getElementById("lcdSteps");
  const lcdDots = [];
  for (let s = 0; s < STEPS; s++) {
    const i = document.createElement("i");
    lcdSteps.appendChild(i);
    lcdDots.push(i);
  }

  const lcdBpm = document.getElementById("lcdBpm");
  const lcdState = document.getElementById("lcdState");
  const playBtn = document.getElementById("playBtn");
  updateUI();

  /* ---------- tiny synth drums ---------- */

  function noiseBuffer(c) {
    const buf = c.createBuffer(1, c.sampleRate * 0.3, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  let noise;

  function playKick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + 0.3);
  }
  function playSnare(t) {
    const n = ctx.createBufferSource(); n.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    n.connect(f).connect(g).connect(ctx.destination);
    n.start(t); n.stop(t + 0.2);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.setValueAtTime(190, t);
    og.gain.setValueAtTime(0.25, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og).connect(ctx.destination);
    o.start(t); o.stop(t + 0.12);
  }
  function playHat(t) {
    const n = ctx.createBufferSource(); n.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    n.connect(f).connect(g).connect(ctx.destination);
    n.start(t); n.stop(t + 0.07);
  }
  function playClap(t) {
    for (let i = 0; i < 3; i++) {
      const n = ctx.createBufferSource(); n.buffer = noise;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 1.2;
      const g = ctx.createGain();
      const st = t + i * 0.012;
      g.gain.setValueAtTime(0.3, st);
      g.gain.exponentialRampToValueAtTime(0.001, st + 0.12);
      n.connect(f).connect(g).connect(ctx.destination);
      n.start(st); n.stop(st + 0.15);
    }
  }
  const voices = [playKick, playSnare, playHat, playClap];

  /* ---------- lookahead scheduler ---------- */

  function stepDur() { return 60 / bpm / 2; } // 8th notes

  function schedule() {
    while (nextTime < ctx.currentTime + 0.12) {
      const s = step, when = nextTime;
      pattern.forEach((row, ti) => { if (row[s] && trackIsAudible(ti)) voices[ti](when); });
      const delay = Math.max(0, (when - ctx.currentTime) * 1000);
      setTimeout(() => { if (playing) paint(s); }, delay);
      step = (step + 1) % STEPS;
      nextTime += stepDur();
    }
  }

  function paint(s) {
    for (let ti = 0; ti < TRACKS.length; ti++)
      for (let i = 0; i < STEPS; i++)
        stepEls[ti][i].classList.toggle("now", i === s);
    lcdDots.forEach((d, i) => d.classList.toggle("lit", i === s));
  }
  function clearPaint() {
    document.querySelectorAll(".step.now").forEach(el => el.classList.remove("now"));
    lcdDots.forEach(d => d.classList.remove("lit"));
  }

  function start() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); noise = noiseBuffer(ctx); }
    ctx.resume();
    playing = true;
    step = 0;
    nextTime = ctx.currentTime + 0.06;
    timer = setInterval(schedule, 25);
    playBtn.setAttribute("aria-pressed", "true");
    playBtn.textContent = "■";
    lcdState.textContent = "PLAY";
  }
  function stop() {
    playing = false;
    clearInterval(timer);
    clearPaint();
    playBtn.setAttribute("aria-pressed", "false");
    playBtn.textContent = "▶";
    lcdState.textContent = "READY";
  }

  playBtn.addEventListener("click", () => (playing ? stop() : start()));

  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !e.repeat && e.target.tagName !== "BUTTON") {
      e.preventDefault();
      playing ? stop() : start();
    }
  });

  function setBpm(v) {
    bpm = Math.min(200, Math.max(60, v));
    lcdBpm.textContent = bpm;
    saveState();
  }
  document.getElementById("bpmUp").addEventListener("click", () => setBpm(bpm + 5));
  document.getElementById("bpmDown").addEventListener("click", () => setBpm(bpm - 5));

  document.getElementById("clearBtn").addEventListener("click", () => {
    pattern.forEach(row => row.fill(0));
    document.querySelectorAll(".step").forEach(el => el.setAttribute("aria-pressed", "false"));
    lcdState.textContent = playing ? "PLAY" : "CLEARED";
    saveState();
  });
})();
</script>
</body>
</html>
