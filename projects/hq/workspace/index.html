<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Roster</title>
    <style>
      /* ---- Page basics: font, background, centered column ---- */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;   /* the OS's default clean font */
        background: #f4f5f7;                   /* soft gray page background */
        color: #1f2430;                        /* near-black text */
      }
      .roster {
        max-width: 720px;                      /* keep the column readable */
        margin: 0 auto;                        /* center it horizontally */
        padding: 48px 24px;
      }

      /* ---- Header: small accent label above the big title ---- */
      .eyebrow {
        color: #e0662c;                        /* the one accent color (orange) */
        font-weight: 700;
        letter-spacing: 0.12em;                /* spaced-out caps look */
        text-transform: uppercase;
        font-size: 0.8rem;
        margin: 0 0 4px;
      }
      .roster-header h1 { margin: 0 0 8px; }
      .roster-header p:last-child { color: #5b6272; margin: 0; }

      /* ---- Card grid: three equal columns, stacks on narrow screens ---- */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 32px;
      }

      /* ---- One member card: white box with an accent top border ---- */
      .card {
        background: #fff;
        border: 1px solid #e3e5ea;
        border-top: 3px solid #e0662c;         /* accent stripe on top */
        border-radius: 10px;
        padding: 20px;
      }
      .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
      .role { margin: 0 0 12px; font-weight: 600; color: #e0662c; }
      .model { margin: 0; font-size: 0.85rem; color: #5b6272; }

      /* ---- Footer: tiny muted credit line under the cards ---- */
      .roster-footer {
        margin-top: 32px;
        text-align: center;
        font-size: 0.8rem;
        color: #8a90a0;                        /* muted gray, quieter than body text */
      }
    </style>
  </head>
  <body>
    <!-- The main landmark contains this page's complete roster. -->
    <main class="roster">
      <header class="roster-header">
        <p class="eyebrow">Agent Terminal</p>
        <h1>Team Roster</h1>
        <p>Meet the three agents building the HQ project together.</p>
      </header>

      <!-- Each article is a self-contained profile for one team member. -->
      <section class="card-grid" aria-label="Team members">
        <article class="card">
          <h2>Boss</h2>
          <p class="role">Lead / Orchestrator</p>
          <p class="model">Model: Claude</p>
        </article>

        <article class="card">
          <h2>Claude</h2>
          <p class="role">Builder</p>
          <p class="model">Model: Claude</p>
        </article>

        <article class="card">
          <h2>Codex</h2>
          <p class="role">Builder</p>
          <p class="model">Model: GPT-5</p>
        </article>
      </section>

      <!-- Small muted credit line for the whole team. -->
      <footer class="roster-footer">Built by the whole team</footer>
    </main>
  </body>
</html>
