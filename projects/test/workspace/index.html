<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG — Agent Terminal Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="ui">
    <div id="menu" class="panel">
      <h1>PONG</h1>
      <p class="sub">agent terminal edition</p>
      <div class="btn-row">
        <button data-mode="1p" class="btn">1 PLAYER</button>
        <button data-mode="2p" class="btn">2 PLAYER</button>
      </div>
      <div class="btn-row" id="difficulty-row">
        <button data-diff="easy" class="btn small">EASY</button>
        <button data-diff="normal" class="btn small sel">NORMAL</button>
        <button data-diff="hard" class="btn small">HARD</button>
      </div>
      <p class="hint">P1: W/S or mouse · P2: ↑/↓ · Space: pause · First to 7</p>
    </div>
    <div id="pause" class="panel hidden">
      <h1>PAUSED</h1>
      <p class="hint">Space to resume · Esc for menu</p>
    </div>
    <div id="gameover" class="panel hidden">
      <h1 id="winner">P1 WINS</h1>
      <div class="btn-row">
        <button id="rematch" class="btn">REMATCH</button>
        <button id="tomenu" class="btn small">MENU</button>
      </div>
    </div>
  </div>
</div>
<!-- optional modules from teammates: define window.SFX / window.FX -->
<script src="sfx.js" defer></script>
<script src="fx.js" defer></script>
<script src="game.js" defer></script>
</body>
</html>
