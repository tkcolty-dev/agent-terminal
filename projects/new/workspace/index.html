<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockbound — 2D Sandbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2385512d'/%3E%3Crect width='16' height='5' fill='%2372c83e'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; height: 100%; }
  #game { display: block; image-rendering: pixelated; cursor: crosshair; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #fff; padding: 10px 14px;
    background: rgba(14,24,29,.68); border: 1px solid rgba(255,255,255,.2); border-radius: 3px;
    box-shadow: 0 8px 24px #0004; backdrop-filter: blur(8px);
    font: 12px/1.6 monospace; text-shadow: 1px 1px 0 #000; pointer-events: none;
    z-index: 10;
  }
  #hotbar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(15,20,22,.82); padding: 7px; border-radius: 4px;
    border: 2px solid #ffffff40; box-shadow: 0 8px 25px #0008;
    z-index: 10;
  }
  #hotbar .slot {
    width: 48px; height: 48px; background: rgba(255,255,255,0.1);
    border: 2px solid #41484a; border-radius: 2px; position: relative;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #hotbar .slot.selected { border-color: #fff; transform: translateY(-3px); box-shadow: inset 0 0 0 2px #181818, 0 5px 10px #000; }
  #hotbar .slot .swatch { width: 28px; height: 28px; box-shadow: inset -5px -5px #0003, inset 4px 4px #fff2; }
  #hotbar .slot .key {
    position: absolute; top: 1px; left: 3px; font-size: 9px; color: #fff;
    opacity: 0.8; text-shadow: 1px 1px 0 #000;
  }
  #hotbar .slot .count {
    position: absolute; bottom: 1px; right: 3px; font-size: 10px; color: #fff;
    font-weight: bold; text-shadow: 1px 1px 0 #000;
  }
  #healthbar {
    position: fixed; top: 16px; right: 16px; width: 160px; height: 20px;
    background: rgba(15,20,22,.82); border: 2px solid #ffffff40; border-radius: 4px;
    box-shadow: 0 8px 25px #0008; overflow: hidden; z-index: 10;
  }
  #healthbar .fill {
    height: 100%; width: 100%; background: linear-gradient(#e0503f, #b8332a);
    transition: width .25s ease;
  }
  #healthbar .label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: bold 11px monospace; text-shadow: 1px 1px 0 #000;
  }
  #healthbar.hit .fill { filter: brightness(2); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="hotbar"></div>

<!-- Codex: Full gameplay engine -->
<script src="core.js"></script>
<!-- Haiku: Rendering -->
<script src="js/render.js"></script>
<!-- Scout: Inventory / hotbar UI -->
<script src="js/inventory.js"></script>
<!-- Scout: Health + fall damage, and save/load -->
<script src="js/health.js"></script>
<script src="js/save.js"></script>
<!-- Claude: Passive mobs (sheep + pigs) -->
<script src="js/mobs.js"></script>
<!-- Scout: synthesized sound effects (no audio files) -->
<script src="js/sound.js"></script>

<script>
  // Game loop
  const game = window.Minecraft2D.createGame(Math.random() * 10000);
  const input = { left: false, right: false, jump: false };
  let lastTime = Date.now();
  Inventory.init();
  Health.init(game.player.x, game.player.y);
  SaveGame.load(game); // no-op if nothing saved yet, or if world size doesn't match
  Mobs.init(game); // after load so mobs sit on the final terrain

  setInterval(() => SaveGame.save(game), 5000);
  window.addEventListener('beforeunload', () => SaveGame.save(game));

  // Input handling
  window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
    if ((e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp')) {
      if (!input.jump && game.player.grounded) Sound.jump();
      input.jump = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
    if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') input.jump = false;
  });

  // Mouse interactions
  document.getElementById('game').addEventListener('mousedown', (e) => {
    const canvas = document.getElementById('game');
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const camera = window.Renderer.camera;
    const tileX = Math.floor((mouseX + camera.x) / window.Minecraft2D.TILE);
    const tileY = Math.floor((mouseY + camera.y) / window.Minecraft2D.TILE);

    if (e.button === 0) { // left = mine
      const minedId = game.interact(tileX, tileY, false);
      if (minedId) { Inventory.add(minedId); Sound.mine(); }
    } else if (e.button === 2) { // right = place
      if (Inventory.consume(Inventory.selected)) {
        game.player.selected = Inventory.selected;
        if (!game.interact(tileX, tileY, true)) Inventory.add(Inventory.selected); // refund on failed placement
        else Sound.place();
      }
    }
  });
  document.getElementById('game').addEventListener('contextmenu', (e) => e.preventDefault());

  // Main loop
  function gameLoop() {
    const now = Date.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    game.update(dt, input);
    Health.update(game);
    Mobs.update(dt, game);
    window.Renderer.render(game);
    Mobs.draw(game);

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
